<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Pétanque Atout — Pointage</title>
  <meta name="description" content="Pointage des parties de Pétanque Atout et statistiques des joueurs.">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pétanque Atout">
  <!-- Tout est local : aucune connexion Internet requise -->
  <link rel="stylesheet" href="app.css?v=__VERSION__">
  <script src="lib/react.production.min.js"></script>
  <script src="lib/react-dom.production.min.js"></script>
</head>
<body class="text-gray-100 min-h-screen overflow-x-hidden">
  <div class="rotate-overlay" aria-live="polite">
    <div class="icone">📱</div>
    <p>Tournez votre téléphone<br>à l'horizontale</p>
  </div>
  <div id="root"></div>
  <script src="app.js?v=__VERSION__"></script>
  <script>
    /* Fonctionnement hors ligne : seulement quand l'application est servie par un site (pas en fichier local) */
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
